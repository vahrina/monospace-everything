<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #141414;
        --fg: #eee;
        --trans: .4s;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        display: flex;
      }
      .switch {
        position: relative;
        width: 3rem;
        height: 28px;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #333;
        border-radius: 1rem;
        transition: var(--trans);
      }
      .slider::before {
        content: '';
        position: absolute;
        inset: 3px auto auto 3px;
        width: 22px;
        height: 22px;
        background: var(--fg);
        border-radius: 50%;
        transition: var(--trans);
      }
      input:checked + .slider {
        background: var(--fg);
      }
      input:checked + .slider::before {
        transform: translateX(1.5rem);
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
    <script src="popup.js"></script>
  </body>
</html>
